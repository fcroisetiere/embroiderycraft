[package]
name = "embcraft-gui"
description = "EmbroideryCraft graphical editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
embcraft-core.workspace = true
embcraft-dst.workspace = true
embcraft-design.workspace = true
embcraft-doc.workspace = true
embcraft-stitch.workspace = true
embcraft-text.workspace = true
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"
egui-file-dialog = "0.15"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }

[lints]
workspace = true

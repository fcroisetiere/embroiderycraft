# ecstick settings. After changing SIZE_MB, FS or LABEL run: sudo ecstick format (erases the stick)

# stick size in MB
SIZE_MB=1024
# fat16 (at most 2048 MB, like the 2 GB sticks the machines use) or fat32
FS=fat16
# volume name shown by the machine (at most 11 letters, upper case)
LABEL=DESIGNS
# how the machine is told about new designs: replug (unplug and plug back) or eject
SWAP=replug
# seconds the stick stays unplugged when designs change (1 is too short for a Tajima TFMX-C)
AWAY=5
# keep the file names, or short: 8.3 upper-case names (HELLO.DST) for older machines
NAMES=keep
